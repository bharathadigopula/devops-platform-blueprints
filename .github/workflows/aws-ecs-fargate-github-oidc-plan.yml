#==============================================================================
# AWS ECS FARGATE OIDC PLAN WORKFLOW
#==============================================================================

name: AWS ECS Fargate OIDC Plan

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name"
        required: true
        default: "dev"
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read
  id-token: write

#==============================================================================
# WORKFLOW JOBS
#==============================================================================

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      INFRA_DIR: blueprints/aws-ecs-fargate-github-oidc/infrastructure/environments/${{ github.event.inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ github.event.inputs.aws_region }}
      TF_VAR_environment: ${{ github.event.inputs.environment }}
      TF_VAR_project_name: "ecs-fargate-oidc"
    steps:
      #==============================================================================
      # SOURCE CHECKOUT
      #==============================================================================
      - name: Checkout
        uses: actions/checkout@v4

      #==============================================================================
      # AWS AUTHENTICATION
      #==============================================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      #==============================================================================
      # TERRAFORM SETUP
      #==============================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      #==============================================================================
      # TERRAFORM INIT
      #==============================================================================
      - name: Terraform Init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init

      #==============================================================================
      # TERRAFORM PLAN
      #==============================================================================
      - name: Terraform Plan
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform plan -input=false -out=tfplan

      #==============================================================================
      # PLAN ARTIFACT
      #==============================================================================
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: aws-ecs-fargate-github-oidc-${{ github.event.inputs.environment }}-tfplan
          path: ${{ env.INFRA_DIR }}/tfplan
          retention-days: 7

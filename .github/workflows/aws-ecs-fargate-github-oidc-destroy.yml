#==============================================================================
# AWS ECS FARGATE OIDC DESTROY WORKFLOW
#==============================================================================

name: AWS ECS Fargate OIDC Destroy

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name"
        required: true
        default: "dev"
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
      confirm_destroy:
        description: "Type destroy-aws-ecs-fargate-github-oidc"
        required: true

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read
  id-token: write

#==============================================================================
# WORKFLOW CONCURRENCY
#==============================================================================

concurrency:
  group: aws-ecs-fargate-github-oidc-${{ github.event.inputs.environment }}
  cancel-in-progress: false

#==============================================================================
# WORKFLOW JOBS
#==============================================================================

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      INFRA_DIR: blueprints/aws-ecs-fargate-github-oidc/infrastructure/environments/${{ github.event.inputs.environment }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}
      TF_BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_alb_deletion_protection: "false"
      TF_VAR_aws_region: ${{ github.event.inputs.aws_region }}
      TF_VAR_environment: ${{ github.event.inputs.environment }}
      TF_VAR_force_delete_ecr: "true"
      TF_VAR_project_name: "ecs-fargate-oidc"
    steps:
      #==============================================================================
      # DESTROY CONFIRMATION
      #==============================================================================
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy-aws-ecs-fargate-github-oidc" ]; then
            echo "Confirmation phrase did not match."
            exit 1
          fi

      #==============================================================================
      # SOURCE CHECKOUT
      #==============================================================================
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      #==============================================================================
      # AWS AUTHENTICATION
      #==============================================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      #==============================================================================
      # TERRAFORM SETUP
      #==============================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.0"

      #==============================================================================
      # BACKEND VARIABLE CHECK
      #==============================================================================
      - name: Check Backend Variables
        run: |
          for name in TF_BACKEND_BUCKET TF_BACKEND_DYNAMODB_TABLE TF_BACKEND_KMS_KEY_ARN; do
            if [ -z "${!name}" ]; then
              echo "$name is required."
              exit 1
            fi
          done

      #==============================================================================
      # TERRAFORM INIT
      #==============================================================================
      - name: Terraform Init
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=aws-ecs-fargate-github-oidc/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ github.event.inputs.aws_region }}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${TF_BACKEND_KMS_KEY_ARN}"

      #==============================================================================
      # TERRAFORM DESTROY
      #==============================================================================
      - name: Terraform Destroy
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform destroy -input=false -auto-approve

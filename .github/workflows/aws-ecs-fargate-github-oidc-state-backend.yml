#==============================================================================
# AWS ECS FARGATE OIDC STATE BACKEND WORKFLOW
#==============================================================================

name: AWS ECS Fargate OIDC State Backend

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub environment used for AWS OIDC role variables"
        required: true
        default: "dev"
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: "Type apply-state-backend"
        required: false

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read
  id-token: write

#==============================================================================
# WORKFLOW CONCURRENCY
#==============================================================================

concurrency:
  group: aws-ecs-fargate-github-oidc-state-backend
  cancel-in-progress: false

#==============================================================================
# WORKFLOW JOBS
#==============================================================================

jobs:
  state-backend:
    name: Terraform State Backend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.github_environment }}
    env:
      INFRA_DIR: blueprints/aws-ecs-fargate-github-oidc/infrastructure/00-state-backend
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ github.event.inputs.aws_region }}
      TF_VAR_project_name: "ecs-fargate-oidc"
    steps:
      #==============================================================================
      # SOURCE CHECKOUT
      #==============================================================================
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      #==============================================================================
      # AWS AUTHENTICATION
      #==============================================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      #==============================================================================
      # TERRAFORM SETUP
      #==============================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.0"

      #==============================================================================
      # TERRAFORM INIT
      #==============================================================================
      - name: Terraform Init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -backend=false

      #==============================================================================
      # TERRAFORM PLAN
      #==============================================================================
      - name: Terraform Plan
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform plan -input=false -out=tfplan

      #==============================================================================
      # TERRAFORM APPLY CONFIRMATION
      #==============================================================================
      - name: Check Apply Confirmation
        if: github.event.inputs.action == 'apply'
        run: |
          if [ "${{ github.event.inputs.confirm_apply }}" != "apply-state-backend" ]; then
            echo "Confirmation phrase did not match."
            exit 1
          fi

      #==============================================================================
      # TERRAFORM APPLY
      #==============================================================================
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
